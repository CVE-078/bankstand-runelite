plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.bankstand.BankstandPluginTest'

dependencies {
	// runelite-client is the only compile dependency. Gson and OkHttp arrive as its
	// transitives, so the plugin ships ZERO third-party runtime dependencies (Plugin
	// Hub requirement). Everything below is compileOnly or test-scope, never bundled.
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.bankstand'
version = '0.2.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// `./gradlew run` launches a developer-mode RuneLite with this plugin sideloaded.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	// JDK 17 dev-mode: RuneLite reflects into java.base to invalidate its annotation
	// caches at startup; open the package so it does not log an InaccessibleObjectException.
	// Non-fatal without it, but this matches what the RuneLite launcher passes.
	jvmArgs "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED"
	// On macOS with JDK 11+, RuneLite's OSXFullScreenAdapter subclasses
	// com.apple.eawt.FullScreenAdapter, which java.desktop no longer exports to the
	// unnamed module, so startup fails with an IllegalAccessError. Grant access when
	// running on a Mac. This affects dev-mode only; it is not part of the plugin.
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
